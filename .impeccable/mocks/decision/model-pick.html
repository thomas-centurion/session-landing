<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Neon</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Archivo+Narrow:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--noche:#0F0906;--ambar:#FA9F3F;--glow:#FEC67C;--rosa:#E9A4A5;--crema:#FFF4EA}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:var(--noche);background-image:repeating-linear-gradient(90deg,#1a100a 0 3px,transparent 3px 60px);font-family:"Archivo Narrow",sans-serif;color:var(--crema);position:relative}
nav{position:absolute;top:32px;left:56px;right:56px;display:flex;justify-content:space-between;font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.08em}
nav .logo{color:var(--rosa);font:italic 700 30px Georgia,serif;text-transform:none}
.neon{position:absolute;left:56px;top:150px;font:800 150px/0.9 "Baloo 2";color:var(--glow);text-shadow:0 0 12px var(--ambar),0 0 40px var(--ambar),0 0 90px #c15b27}
.neon .r{color:#ffd9da;text-shadow:0 0 12px var(--rosa),0 0 40px var(--rosa)}
.board{position:absolute;right:56px;top:150px;width:440px;height:620px;border:2px solid rgba(254,198,124,.4);border-radius:22px;padding:32px}
.board h2{font:800 40px "Baloo 2";color:var(--glow);margin-bottom:22px}
.row{display:flex;justify-content:space-between;font-size:26px;padding:12px 0;border-bottom:1px dashed rgba(255,244,234,.25)}
.cta{position:absolute;left:56px;top:760px;display:flex;gap:16px}
.cta a{font:700 22px "Archivo Narrow";text-transform:uppercase;padding:16px 30px;border-radius:999px;border:2px solid var(--glow);color:var(--glow)}
.cta a:first-child{background:var(--ambar);color:#140C08;border-color:var(--ambar)}
</style></head><body>
<nav><span class="logo">Session Haus</span><span>Carta · Promos · Patio · Delivery</span></nav>
<div class="neon">Más amor<br>y más <span class="r">cerveza</span></div>
<div class="board"><h2>Hoy en la barra</h2>
<div class="row"><span>2x1 burgers</span><span>HOY</span></div>
<div class="row"><span>Session 19 a 23 hs</span><span>●</span></div>
<div class="row"><span>Cerveza artesanal</span><span>$ —</span></div>
<div class="row"><span>Burgers</span><span>$ —</span></div>
<div class="row"><span>Wraps y nachos</span><span>$ —</span></div></div>
<div class="cta"><a>Ver la carta</a><a>Pedir delivery</a></div>
</body></html>
