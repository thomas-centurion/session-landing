<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Estándar</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:system-ui,sans-serif;background:#140C08;color:#FFF4EA;position:relative}
.hero{position:absolute;inset:0;background:linear-gradient(rgba(20,12,8,.35),rgba(20,12,8,.85)),linear-gradient(120deg,#0B2E36,#3E2318 55%,#140C08)}
nav{position:absolute;top:0;left:0;right:0;height:84px;display:flex;justify-content:space-between;align-items:center;padding:0 56px;background:rgba(20,12,8,.7)}
nav b{font:italic 700 30px Georgia,serif;color:#E9A4A5}
nav span{font-size:18px}
.copy{position:absolute;left:50%;top:300px;transform:translateX(-50%);text-align:center;width:900px}
.copy h1{font:800 76px/1.05 system-ui;margin-bottom:18px}
.copy p{font-size:24px;opacity:.8;margin-bottom:34px}
.copy a{display:inline-block;background:#E9A4A5;color:#140C08;font:700 22px system-ui;padding:18px 40px;border-radius:999px;margin:0 8px}
.copy a.g{background:transparent;border:2px solid #FFF4EA;color:#FFF4EA}
</style></head><body>
<div class="hero"></div>
<nav><b>Session Haus</b><span>Inicio · Carta · Promos · Galería · Contacto</span></nav>
<div class="copy"><h1>Cerveza artesanal, burgers y buena compañía</h1><p>Pergamino, Buenos Aires</p><a>Ver carta</a><a class="g">Cómo llegar</a></div>
</body></html>
