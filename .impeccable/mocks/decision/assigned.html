<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Posavasos</title>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo+Narrow:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--noche:#140C08;--madera:#2A1A10;--rosa:#E9A4A5;--ambar:#FA9F3F;--crema:#FFF4EA;--tinta:#0B0807;--cobre:#BC5F20}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:var(--madera);
 background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 46px),repeating-linear-gradient(90deg,rgba(255,180,120,.04) 0 1px,transparent 1px 13px);
 font-family:"Archivo Narrow",sans-serif;color:var(--crema);position:relative}
nav{position:absolute;top:28px;left:48px;right:48px;display:flex;justify-content:space-between;align-items:center}
.logo{background:var(--tinta);color:var(--rosa);font:italic 700 34px/1 Georgia,serif;padding:14px 26px;border:5px solid var(--crema);border-radius:40px;transform:rotate(-4deg)}
nav ul{display:flex;gap:28px;list-style:none;font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.photo{position:absolute;left:48px;top:120px;width:560px;height:740px;background:linear-gradient(#0B2E36,#3E2318 60%,#140C08);border:14px solid var(--crema);transform:rotate(-2deg);box-shadow:0 30px 60px rgba(0,0,0,.55)}
.photo span{position:absolute;bottom:-50px;left:10px;font:700 20px "Archivo Narrow";color:var(--crema)}
h1{position:absolute;left:660px;top:120px;width:720px;font:400 92px/0.95 "Alfa Slab One",serif;color:var(--crema)}
h1 em{font-style:normal;color:var(--rosa)}
.c{position:absolute;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 18px 30px rgba(0,0,0,.5),inset 0 0 0 10px rgba(0,0,0,.08)}
.c1{left:660px;top:430px;width:360px;height:360px;background:var(--rosa);color:var(--tinta);transform:rotate(-8deg)}
.c1 b{font:400 120px/1 "Alfa Slab One"} .c1 p{font:700 26px/1.1 "Archivo Narrow";text-transform:uppercase}
.c1 i{position:absolute;top:34px;font:700 18px "Archivo Narrow";background:var(--tinta);color:var(--rosa);padding:4px 12px;border-radius:12px;font-style:normal}
.c2{left:990px;top:470px;width:300px;height:300px;background:var(--ambar);color:var(--tinta);transform:rotate(7deg)}
.c2 b{font:400 46px/1 "Alfa Slab One"} .c2 p{font:700 24px "Archivo Narrow"}
.c3{left:1190px;top:330px;width:200px;height:200px;background:var(--crema);color:var(--tinta);transform:rotate(-12deg);border-radius:18px}
.c3 b{font:400 30px/1 "Alfa Slab One"}
.cta{position:absolute;left:660px;top:820px;font:700 22px "Archivo Narrow";text-transform:uppercase;letter-spacing:.08em;background:var(--crema);color:var(--tinta);padding:14px 28px;border-radius:999px}
</style></head><body>
<nav><div class="logo">Session Haus</div><ul><li>Carta</li><li>Promos</li><li>El patio</li><li>Delivery</li><li>Cómo llegar</li></ul></nav>
<div class="photo"><span>Foto 1 · patio de noche</span></div>
<h1>Más amor<br>y más <em>cerveza</em>.</h1>
<div class="c c1"><i>HOY</i><b>2x1</b><p>en todas<br>las burgers</p></div>
<div class="c c2"><b>Hoy sale<br>Session</b><p>de 19 a 23 hs</p></div>
<div class="c c3"><b>Ver la<br>carta ↓</b></div>
<a class="cta">Pedir delivery</a>
</body></html>
