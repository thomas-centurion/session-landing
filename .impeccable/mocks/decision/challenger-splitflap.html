<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Tablero</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo+Narrow:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--marco:#2A1A10;--flap:#120C09;--crema:#FFF4EA;--ambar:#FA9F3F;--rosa:#E9A4A5}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:var(--marco);font-family:"Archivo Narrow",sans-serif;color:var(--crema);padding:40px 56px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.logo{background:#0B0807;color:var(--rosa);font:italic 700 30px Georgia,serif;padding:10px 22px;border:4px solid var(--crema);border-radius:30px}
header nav{font:700 18px "Archivo Narrow";letter-spacing:.08em;text-transform:uppercase}
h1{font:400 64px/1 "Bebas Neue";letter-spacing:.04em;margin-bottom:22px}
.head,.r{display:grid;grid-template-columns:140px 1fr 360px 160px;gap:10px;align-items:center}
.head{font:700 16px "Archivo Narrow";letter-spacing:.12em;color:rgba(255,244,234,.6);padding:0 0 8px}
.r{margin-bottom:10px}
.r>div{background:var(--flap);height:76px;display:flex;align-items:center;padding:0 16px;font:400 48px/1 "Bebas Neue";letter-spacing:.12em;position:relative;border-radius:4px}
.r>div::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#000}
.r.hoy>div:last-child{background:var(--ambar);color:#120C09}
.r.dim{opacity:.45}
.r .p{color:var(--rosa)}
</style></head><body>
<header><div class="logo">Session Haus</div><nav>Carta · Promos · Patio · Delivery · Cómo llegar</nav></header>
<h1>Próximas salidas desde la barra</h1>
<div class="head"><span>HORA</span><span>QUÉ SALE</span><span>DÓNDE</span><span>ESTADO</span></div>
<div class="r hoy"><div>19:00</div><div>HOY SALE SESSION</div><div>BARRA</div><div>HOY</div></div>
<div class="r hoy"><div>20:00</div><div class="p">2X1 BURGERS</div><div>LOCAL · DELIVERY</div><div>HOY</div></div>
<div class="r"><div>—</div><div>CERVEZA ARTESANAL</div><div>CANILLA</div><div>$ —</div></div>
<div class="r"><div>—</div><div>WRAP + NACHOS</div><div>COCINA</div><div>$ —</div></div>
<div class="r dim"><div>—</div><div>PROMO DE OTRO DÍA</div><div>—</div><div>MAR</div></div>
</body></html>
